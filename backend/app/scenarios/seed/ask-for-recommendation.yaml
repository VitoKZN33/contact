slug: ask-for-recommendation
version: 1
category: favor
sort_order: 110
title: Попросить о рекомендации
description: Вы откликнулись на вакансию в компанию, где работает бывший однокурсник. Вы не общались два года.
objective: Восстановить контакт и попросить о рекомендации так, чтобы человеку было легко согласиться или отказать.
starts: user
allowed_personas: [friendly, neutral, reserved, skeptical, demanding, sociable]
role:
  who: Бывший однокурсник, сейчас тимлид в крупной компании. Занят, получает много подобных просьб.
  setting: Переписка в мессенджере, рабочий день, середина недели.
  relationship: Учились в одной группе, неплохо общались, после выпуска контакт сошёл на нет.
  persona_goal: Помочь, если просьба ясная и человек ему знаком. Не любит, когда сразу просят без контекста.
  hidden_context: Получает бонус за успешную рекомендацию, но вакансия не в его команде.
  ending_hint: Персонаж соглашается, вежливо отказывает или просит прислать резюме.
  names:
    male: [Станислав, Геннадий, Всеволод]
    female: [Валерия, Ангелина, Маргарита]
evaluation:
  criteria:
    - key: reconnect
      title: Восстановление контакта
      description: Начал ли с тёплого повода, а не с просьбы в первом сообщении.
    - key: clear_ask
      title: Чёткая просьба
      description: Понятно ли, о чём просят — вакансия, ссылка, что нужно от собеседника.
    - key: easy_out
      title: Право отказать
      description: Оставил ли собеседнику простую возможность отказаться без неловкости.
    - key: gratitude
      title: Благодарность
      description: Поблагодарил ли и предложил ли что-то в ответ.
