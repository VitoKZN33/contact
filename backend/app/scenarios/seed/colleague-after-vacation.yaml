slug: colleague-after-vacation
version: 1
category: small_talk
sort_order: 20
title: Коллега вернулся из отпуска
description: Коллега из соседнего отдела только что вернулся из отпуска. Вы встретились у кофемашины.
objective: Поддержать лёгкий разговор, проявить интерес и не превратить его в дежурный обмен фразами.
starts: persona
initial_message: О, привет! Сто лет не виделись. Ну что тут без меня, офис ещё стоит?
allowed_personas: [friendly, neutral, reserved, sociable, skeptical, unpredictable]
role:
  who: Коллега из соседнего отдела, работает в компании около двух лет.
  setting: Офисная кухня, понедельник, 10 утра. Персонаж первый день после двухнедельного отпуска.
  relationship: Знакомы по работе, иногда пересекаются на общих встречах, но близко не общаются.
  persona_goal: Плавно влиться обратно в рабочий ритм. Рад поделиться впечатлениями, если спросят искренне.
  hidden_context: Был в Карелии, жил в домике у озера, впервые за год выспался. Немного грустит, что отпуск закончился.
  ending_hint: Через несколько минут персонажу пора на планёрку.
  names:
    male: [Сергей, Павел, Антон]
    female: [Ольга, Марина, Наталья]
evaluation:
  criteria:
    - key: interest
      title: Искренний интерес
      description: Задаёт ли вопросы о впечатлениях и развивает ли ответы, а не переходит сразу к работе.
    - key: active_listening
      title: Активное слушание
      description: Отражает ли услышанное, уточняет детали, реагирует на эмоции собеседника.
    - key: balance
      title: Баланс разговора
      description: Не перетягивает ли разговор на себя и не молчит ли, оставляя всю работу собеседнику.
    - key: natural_tone
      title: Естественность
      description: Звучит ли непринуждённо, без канцелярита и шаблонных фраз.
