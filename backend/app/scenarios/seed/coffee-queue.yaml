slug: coffee-queue
version: 1
category: acquaintance
sort_order: 10
title: Очередь в кофейне
description: Утро, длинная очередь за кофе. Рядом стоит человек, который тоже явно никуда не спешит.
objective: Начать разговор с незнакомцем без неловкости и поддержать его хотя бы несколько реплик.
starts: user
allowed_personas: [friendly, neutral, reserved, shy, sociable, skeptical, unpredictable]
role:
  who: Посетитель кофейни около 30 лет, работает неподалёку, заходит сюда почти каждое утро.
  setting: Небольшая кофейня в центре города, будний день, 8:40. Очередь из шести человек, бариста один.
  relationship: Незнакомы. Пользователь стоит в очереди прямо перед персонажем или за ним.
  persona_goal: Спокойно дождаться кофе. Не против поболтать, если собеседник покажется приятным и не навязчивым.
  hidden_context: Знает, что здесь лучший раф в районе, но по утрам всегда очередь.
  ending_hint: Разговор естественно заканчивается, когда подходит очередь персонажа или он получает заказ.
  names:
    male: [Артём, Илья, Денис]
    female: [Анна, Ксения, Вера]
evaluation:
  criteria:
    - key: opening
      title: Начало разговора
      description: Насколько естественно и уместно пользователь начал разговор, опираясь на ситуацию вокруг.
    - key: questions
      title: Открытые вопросы
      description: Задаёт ли вопросы, на которые нельзя ответить только «да» или «нет», и цепляется ли за ответы.
    - key: reading_signals
      title: Чтение сигналов
      description: Замечает ли, хочет ли собеседник общаться, и подстраивает ли напор.
    - key: closing
      title: Завершение
      description: Сумел ли красиво закончить разговор или оставить возможность продолжить.
  notes: Короткий разговор длиной в 4–6 реплик — нормальный результат для этой ситуации.
