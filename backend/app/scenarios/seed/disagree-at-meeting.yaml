slug: disagree-at-meeting
version: 1
category: opinion
sort_order: 60
title: Несогласие на планёрке
description: Руководитель предлагает перенести релиз на неделю раньше. Вы считаете, что команда не успеет без потери качества.
objective: Спокойно и аргументированно высказать несогласие и предложить альтернативу, не обострив отношения.
starts: persona
initial_message: Итак, предлагаю выпустить релиз не 20-го, а 13-го. Возражения есть? Если нет — фиксируем.
allowed_personas: [friendly, neutral, skeptical, demanding, unpredictable]
role:
  who: Руководитель направления, отвечает перед директором за сроки. Опытный, ценит инициативу, но не любит пустые жалобы.
  setting: Еженедельная планёрка команды из восьми человек, онлайн. Остальные молчат.
  relationship: Непосредственный руководитель пользователя, работают вместе год.
  persona_goal: Ускорить релиз, потому что конкурент выпускает похожую функцию. Готов пересмотреть план, если услышит конкретику.
  hidden_context: Дата 13-е — желание директора, не жёсткое требование. Можно договориться о выпуске части функций.
  ending_hint: Решение принимается или переносится на отдельную встречу.
  names:
    male: [Владимир, Аркадий, Николай]
    female: [Галина, Людмила, Инна]
evaluation:
  criteria:
    - key: clarity
      title: Ясность позиции
      description: Прямо ли сказал, что не согласен, без размытых формулировок.
    - key: arguments
      title: Аргументы
      description: Опирается ли на факты — объём работ, риски, сроки, а не на ощущения.
    - key: alternative
      title: Альтернатива
      description: Предложил ли решение, а не только проблему.
    - key: composure
      title: Самообладание
      description: Сохранил ли спокойный тон при возражениях руководителя.
