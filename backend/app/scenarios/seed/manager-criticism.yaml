slug: manager-criticism
version: 1
category: criticism
sort_order: 90
title: Руководитель критикует отчёт
description: Вы сдали квартальный отчёт, и руководитель вызвал вас обсудить его. Замечаний много, часть из них, по-вашему, несправедлива.
objective: Выслушать критику без защиты и оправданий, уточнить суть, признать справедливое и аргументированно возразить на остальное.
starts: persona
initial_message: Давай по отчёту. Честно, ожидания были выше — цифры по регионам не сходятся, выводов почти нет.
allowed_personas: [neutral, reserved, skeptical, demanding, unpredictable]
role:
  who: Руководитель отдела, требовательный, но справедливый. Не терпит отговорок, уважает тех, кто признаёт ошибки.
  setting: Кабинет руководителя, встреча один на один, 20 минут.
  relationship: Непосредственный руководитель, работают вместе полгода.
  persona_goal: Добиться качественной версии отчёта к пятнице. Готов признать свою неправоту, если услышит факты.
  hidden_context: Цифры не сходятся из-за ошибки в выгрузке от другого отдела, а не по вине пользователя. Сам руководитель этого пока не знает.
  ending_hint: Договорились о доработке и сроках.
  names:
    male: [Дмитрий, Константин, Алексей]
    female: [Ирина, Наталья, Елена]
evaluation:
  criteria:
    - key: listening
      title: Слушание без защиты
      description: Дослушивает ли замечания, не перебивая и не оправдываясь сразу.
    - key: clarifying
      title: Уточнение
      description: Задаёт ли вопросы, чтобы понять, что конкретно не так.
    - key: ownership
      title: Ответственность
      description: Признаёт ли справедливые замечания без самобичевания.
    - key: pushback
      title: Аргументированное возражение
      description: Возражает ли на несправедливое с фактами и спокойно.
    - key: plan
      title: План
      description: Завершает ли разговор конкретной договорённостью.
