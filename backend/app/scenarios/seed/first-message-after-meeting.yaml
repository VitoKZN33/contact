slug: first-message-after-meeting
version: 1
category: messaging
sort_order: 50
title: Написать первым после знакомства
description: Вчера на дне рождения друга вы познакомились с интересным человеком и обменялись контактами. Пора написать.
objective: Написать первое сообщение так, чтобы на него захотелось ответить, и перевести переписку в договорённость о встрече.
starts: user
allowed_personas: [friendly, neutral, reserved, shy, sociable, skeptical, unpredictable]
role:
  who: Человек, с которым вчера полчаса разговаривали о путешествиях и любимых сериалах.
  setting: Переписка в мессенджере. Персонаж отвечает как в чате — коротко, иногда с задержкой по смыслу.
  relationship: Познакомились вчера, разговор был приятным, контактами обменялись по инициативе пользователя.
  persona_goal: Не прочь продолжить общение, но не будет инициативнее собеседника. Не любит сухие «Привет, как дела».
  hidden_context: Вчера упоминал, что собирается на выставку в эти выходные.
  ending_hint: Переписка заканчивается договорённостью о встрече или естественно затухает.
  names:
    male: [Лев, Марк, Фёдор]
    female: [Ева, Лилия, Диана]
evaluation:
  criteria:
    - key: hook
      title: Первое сообщение
      description: Отсылает ли к вчерашнему разговору, есть ли в нём повод ответить.
    - key: chat_style
      title: Стиль переписки
      description: Пишет ли кратко и живо, без простыней текста и без допроса.
    - key: initiative
      title: Инициатива
      description: Предлагает ли конкретный следующий шаг — встречу, событие, время.
    - key: pressure
      title: Без давления
      description: Сохраняет ли лёгкость, если собеседник отвечает уклончиво.
